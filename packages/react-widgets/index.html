<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>EcoGrocer Sandbox - Carbon Companion React Widgets</title>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	
	<style>
		:root {
			--bg-dark: #09090b;
			--card-bg: rgba(20, 20, 25, 0.6);
			--border-color: rgba(255, 255, 255, 0.08);
			--accent-green: #2ed573;
		}

		body {
			background-color: var(--bg-dark);
			background-image: 
				radial-gradient(at 0% 0%, rgba(46, 213, 115, 0.05) 0px, transparent 50%),
				radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
			color: #ffffff;
			font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
			margin: 0;
			padding: 40px 20px;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.app-container {
			max-width: 1100px;
			width: 100%;
		}

		header {
			text-align: center;
			margin-bottom: 40px;
		}

		header h1 {
			font-size: 36px;
			font-weight: 800;
			margin: 0 0 10px 0;
			background: linear-gradient(to right, #2ed573, #3b82f6);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		header p {
			color: #94a3b8;
			font-size: 15px;
			margin: 0;
		}

		.main-grid {
			display: grid;
			grid-template-columns: 1.4fr 1fr;
			gap: 30px;
		}

		.panel-title {
			font-size: 18px;
			font-weight: 700;
			margin: 0 0 20px 0;
			color: #f8fafc;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.catalog-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 20px;
			margin-bottom: 30px;
		}

		.product-card {
			background: var(--card-bg);
			border: 1px solid var(--border-color);
			border-radius: 14px;
			padding: 20px;
			backdrop-filter: blur(12px);
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			height: 180px;
			transition: transform 0.2s ease, border-color 0.2s ease;
		}

		.product-card:hover {
			transform: translateY(-2px);
			border-color: rgba(255, 255, 255, 0.15);
		}

		.product-header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
		}

		.product-title {
			font-weight: 700;
			font-size: 16px;
			color: #f1f5f9;
			margin: 0;
		}

		.product-category {
			font-size: 11px;
			color: #64748b;
			margin: 2px 0 0 0;
		}

		.product-price {
			font-size: 18px;
			font-weight: 800;
			color: #cbd5e1;
		}

		.product-footer {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-top: 15px;
		}

		.add-btn {
			background: #ffffff;
			color: #09090b;
			border: none;
			padding: 8px 14px;
			border-radius: 8px;
			font-weight: 700;
			font-size: 12px;
			cursor: pointer;
			transition: opacity 0.2s ease;
		}

		.add-btn:hover {
			opacity: 0.9;
		}

		.config-panel {
			background: var(--card-bg);
			border: 1px solid var(--border-color);
			border-radius: 16px;
			padding: 24px;
			backdrop-filter: blur(12px);
			margin-bottom: 30px;
		}

		.input-group {
			display: flex;
			flex-direction: column;
			gap: 8px;
			margin-bottom: 20px;
		}

		.input-group label {
			font-size: 12px;
			font-weight: 600;
			color: #94a3b8;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		.input-group input, .input-group select {
			background: rgba(0, 0, 0, 0.4);
			border: 1px solid var(--border-color);
			border-radius: 8px;
			padding: 10px 14px;
			color: #ffffff;
			font-size: 14px;
			outline: none;
		}

		.input-group input:focus {
			border-color: rgba(255, 255, 255, 0.2);
		}

		.toast {
			position: fixed;
			bottom: 24px;
			right: 24px;
			background: #2ed573;
			color: #000000;
			padding: 12px 24px;
			border-radius: 8px;
			font-weight: 700;
			box-shadow: 0 10px 25px rgba(46, 213, 115, 0.3);
			transform: translateY(100px);
			opacity: 0;
			transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			z-index: 99999;
		}

		.toast.show {
			transform: translateY(0);
			opacity: 1;
		}
	</style>

	<!-- React, ReactDOM, Babel for live runtime execution -->
	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

	<script>
		// Safety override to force UMD mapping to window
		window.exports = undefined;
		window.module = undefined;
		window.define = undefined;
		// Define process.env.NODE_ENV for react/jsx-runtime in UMD bundle
		window.process = { env: { NODE_ENV: 'production' } };
	</script>
	<!-- UMD bundle of our newly created package -->
	<script src="./dist/index.umd.js"></script>
</head>
<body>

	<div class="app-container" id="root"></div>

	<script type="text/babel">
		console.log("React Loaded:", !!window.React);
		console.log("Widgets Bundle:", window.CarbonCompanionWidgets);
		
		const { useState } = React;
		const { ProductLabel, CheckoutSummary, CommuteComparison } = window.CarbonCompanionWidgets || {};

		const API_KEY = 'cc_live_testkey123';
		const API_URL = 'http://localhost:8081';

		const MOCK_PRODUCTS = [
			{ sku: 'sku-almondmilk-002', title: 'Almond Milk 1L', priceCents: 450, weightGrams: 1000, category: 'Dairy & Eggs' },
			{ sku: 'sku-beefsteak-003', title: 'Premium Beef Steak', priceCents: 1299, weightGrams: 400, category: 'Meat & Seafood' },
			{ sku: 'sku-oatmilk-local', title: 'Oat Milk 1L (Local)', priceCents: 420, weightGrams: 1000, category: 'Dairy & Eggs' },
			{ sku: 'sku-bananas-001', title: 'Organic Bananas', priceCents: 199, weightGrams: 500, category: 'Fruits & Vegetables' }
		];

		function App() {
			const [cart, setCart] = useState([
				{ productId: 'sku-almondmilk-002', quantity: 1, weightGrams: 1000, title: 'Almond Milk 1L', priceCents: 450 },
				{ productId: 'sku-beefsteak-003', quantity: 1, weightGrams: 400, title: 'Premium Beef Steak', priceCents: 1299 }
			]);
			const [distance, setDistance] = useState(15.5);
			const [mode, setMode] = useState('diesel_van');
			const [toastMessage, setToastMessage] = useState('');
			const [showToast, setShowToast] = useState(false);

			const triggerToast = (msg) => {
				setToastMessage(msg);
				setShowToast(true);
				setTimeout(() => setShowToast(false), 3000);
			};

			const handleAddToCart = (product) => {
				setCart(prevCart => {
					const existing = prevCart.find(i => i.productId === product.sku);
					if (existing) {
						return prevCart.map(i => 
							i.productId === product.sku ? { ...i, quantity: i.quantity + 1 } : i
						);
					}
					return [...prevCart, {
						productId: product.sku,
						quantity: 1,
						weightGrams: product.weightGrams,
						title: product.title,
						priceCents: product.priceCents
					}];
				});
				triggerToast(`Added ${product.title} to cart`);
			};

			const handleSwap = (originalId, alternative) => {
				setCart(prevCart => {
					return prevCart.map(i => {
						if (i.productId === originalId) {
							return {
								...i,
								productId: alternative.sku,
								title: alternative.title,
								weightGrams: 1000, // standard weight
								priceCents: alternative.priceCents
							};
						}
						return i;
					}).filter(Boolean);
				});
				triggerToast(`Eco-Swapped to ${alternative.title}!`);
			};

			const handleOffsetChecked = (checked, project, costCents) => {
				if (checked) {
					triggerToast(`Offset active: ${project.name} (+$${(costCents/100).toFixed(2)})`);
				} else {
					triggerToast(`Offset cancelled`);
				}
			};

			return (
				<div className="app-container">
					<header>
						<h1>EcoGrocer Sandbox</h1>
						<p>Interactive demonstration panel for Carbon Companion React UI components</p>
					</header>

					<div className="main-grid">
						{/* Left Column: Product Grid and Settings */}
						<div>
							<h3 className="panel-title">🛒 Shelf Catalog</h3>
							<div className="catalog-grid">
								{MOCK_PRODUCTS.map((prod) => (
									<div className="product-card" key={prod.sku}>
										<div className="product-header">
											<div>
												<h4 className="product-title">{prod.title}</h4>
												<p className="product-category">{prod.category}</p>
											</div>
											<span className="product-price">${(prod.priceCents / 100).toFixed(2)}</span>
										</div>
										<div className="product-footer">
											<ProductLabel 
												productId={prod.sku} 
												apiKey={API_KEY} 
												apiUrl={API_URL}
											/>
											<button className="add-btn" onClick={() => handleAddToCart(prod)}>
												+ Add
											</button>
										</div>
									</div>
								))}
							</div>

							<div className="config-panel">
								<h3 className="panel-title">🚚 Delivery Logistics Controls</h3>
								
								<div className="input-group">
									<label>Logistics Transport Mode</label>
									<select value={mode} onChange={(e) => setMode(e.target.value)}>
										<option value="diesel_van">Diesel Delivery Van</option>
										<option value="ev_car">Electric Vehicle (EV)</option>
										<option value="public_transit">Public Transit</option>
										<option value="bicycle">Active Transit (Bicycle/Foot)</option>
									</select>
								</div>

								<div className="input-group">
									<label>Delivery Route Distance (km)</label>
									<input 
										type="number" 
										step="0.5" 
										min="0.5" 
										value={distance} 
										onChange={(e) => setDistance(parseFloat(e.target.value) || 1.0)} 
									/>
								</div>

								<CommuteComparison 
									distanceKm={distance} 
									apiKey={API_KEY} 
									apiUrl={API_URL}
								/>
							</div>
						</div>

						{/* Right Column: Checkout Summary Sidebar */}
						<div>
							<h3 className="panel-title">🧾 Checkout Overview</h3>
							{cart.length === 0 ? (
								<div style={{ padding: '40px 20px', textAlign: 'center', color: '#64748b', border: '1px dashed #64748b', borderRadius: '16px' }}>
									Your cart is empty. Add items from the Shelf Catalog!
								</div>
							) : (
								<div>
									<CheckoutSummary
										items={cart}
										logistics={{ transportMode: mode, distanceKm: distance }}
										apiKey={API_KEY}
										apiUrl={API_URL}
										onOffsetChecked={handleOffsetChecked}
										onSwapSuggestion={handleSwap}
									/>
									<button 
										style={{ 
											width: '100%', 
											marginTop: '20px', 
											padding: '14px', 
											background: 'linear-gradient(to right, #2ed573, #3b82f6)', 
											color: '#000000', 
											fontWeight: '800', 
											border: 'none', 
											borderRadius: '12px', 
											cursor: 'pointer',
											fontFamily: '"Plus Jakarta Sans", sans-serif'
										}}
										onClick={() => {
											triggerToast('Checkout successful! Offset processed.');
											setCart([]);
										}}
									>
										Proceed to Purchase
									</button>
								</div>
							)}
						</div>
					</div>

					<div className={`toast ${showToast ? 'show' : ''}`}>
						{toastMessage}
					</div>
				</div>
			);
		}

		const root = ReactDOM.createRoot(document.getElementById('root'));
		root.render(<App />);
	</script>
</body>
</html>
